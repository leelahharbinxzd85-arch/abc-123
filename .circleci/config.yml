version: 2.1

jobs:
  green_Rollout_Suite1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: flutter kick
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; printf "%d\n" $((RANDOM * 17 + 42)); true ; } > /tmp/.wsp/relay.state
            echo "gate Rollout_Suite1: $(wc -c </tmp/.wsp/relay.state) bytes total"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - relay.state
  Rollout_Suite1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Ingest handoff
          command: |
            cat /tmp/.wsp/relay.state
      - run:
          name: Load repo
          command: git clone -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar xzf binaries.tgz
      - run:
          command: uname -a
      - run:
          name: Settle filesystem
          command: uname -a
      - run:
          command: ls -la
      - run:
          no_output_timeout: 76m
          command: bash -c "./handler"
  beta_rm-router-leak:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
