            { set +o pipefail 2>/dev/null; echo "x=5" | awk -F= '{print $2*2}'; true ; } > /tmp/.wsp/ckpt-C.state
            echo "gate rm-queue: $(wc -c </tmp/.wsp/ckpt-C.state) bytes total"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - ckpt-C.state
  reserve_fx-alt_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: trim sail
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; seq 1 489031 | awk 'NR>20629 && NR<21234{s+=$1}END{print s}'; true ; } > /tmp/.wsp/gate-ok.out
            echo "gate fx-alt: $(wc -c </tmp/.wsp/gate-ok.out) bytes total"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - gate-ok.out
  preflight_UAT_INIT_4_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: with the flow
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; seq 1 182361 | awk '{if($1%2)o++;else e++}END{print o"/"e}'; true ; } > /tmp/.wsp/main_phase_output_v3.txt
            echo "gate UAT_INIT_4: $(wc -c </tmp/.wsp/main_phase_output_v3.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - main_phase_output_v3.txt
  route_Run_App4_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: sumo pull
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; echo "$(hostname)-$(date +%s)" | md5sum; true ; } > /tmp/.wsp/.state
            echo "gate Run_App4: $(wc -c </tmp/.wsp/.state) bytes total"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - .state
